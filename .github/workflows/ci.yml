name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs only read the repo.
permissions:
  contents: read

jobs:
  macos:
    name: macOS build + test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift build
        run: swift build
      - name: Swift test
        run: swift test

  linux:
    name: Linux verify + shell syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mirror logic verification (no Swift required)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/verify_logic.py
      - name: Shell syntax check
        run: |
          set -eu
          bash -n scripts/show-usage.sh
          bash -n scripts/run-token-bar.sh
          bash -n scripts/build-app.sh
          bash -n scripts/package-release.sh
          sh -n scripts/show-usage.sh
          sh -n scripts/run-token-bar.sh
          sh -n scripts/build-app.sh
          sh -n scripts/package-release.sh
          test -x scripts/show-usage.sh
          test -x scripts/run-token-bar.sh
          test -x scripts/build-app.sh
          test -x scripts/package-release.sh

  privacy:
    name: Privacy gate (bounded opt-in network/subprocess use)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confine network and subprocess use to the documented opt-ins
        run: |
          set -eu
          # The ONLY network/subprocess uses in the codebase are opt-in:
          # - the pricing refresh (PricingService: one GET of public
          #   model/pricing metadata, no prompts/counts/paths/credentials
          #   sent; see docs/PRICING.md). Request is built by
          #   PricingService.makeCatalogRequest (pure, unit-pinned: GET, no
          #   body, no query, no auth/cookie headers) and refresh is strictly
          #   user-initiated (app button / CLI --refresh-pricing).
          # - the homeserver sync (OpenCodeSync: an ssh/scp download of the
          #   token-only snapshot over the user's own SSH setup, never a
          #   shell, BatchMode=yes, no credentials stored, no usage data
          #   sent; disabled by default). Triggered only by enabling sync in
          #   Settings (startup, interval, Sync Now) or CLI --sync-now.
          #   Usage loading, tests, and default CLI runs never touch the
          #   network or spawn a subprocess.
          #
          # 1. URLSession may appear ONLY in PricingService.swift.
          #    (pre-existing local-only comment in Store.swift and the
          #    "privacy-denylist" snapshot field names in OpenCodeStore.swift
          #    are not network use and stay allowed.)
          session_hits="$(grep -rln 'URLSession' Sources/ || true)"
          echo "$session_hits"
          # NOTE: plain for-loop (not a pipeline) so a failure exits the job.
          for file in $session_hits; do
            if [ "$file" != "Sources/TokenBarCore/PricingService.swift" ]; then
              echo "Privacy gate failed: URLSession outside PricingService.swift: $file"
              exit 1
            fi
          done
          # 1b. Process( subprocess use may appear ONLY in OpenCodeSync.swift.
          #     (ProcessInfo environment reads elsewhere are not subprocesses.)
          process_hits="$(grep -rln 'Process(' Sources/ || true)"
          echo "$process_hits"
          for file in $process_hits; do
            if [ "$file" != "Sources/TokenBarCore/OpenCodeSync.swift" ]; then
              echo "Privacy gate failed: Process( outside OpenCodeSync.swift: $file"
              exit 1
            fi
          done
          # 1c. No shell invocation: the sync pull uses argv arrays only.
          shell_hits="$(grep -rn '/bin/sh\|sh -c\|system(' Sources/TokenBarCore/OpenCodeSync.swift Sources/TokenBarApp/OpenCodeSyncController.swift || true)"
          if [ -n "$shell_hits" ]; then
            echo "Privacy gate failed: shell use in sync code:"
            echo "$shell_hits"
            exit 1
          fi
          # 2. No credential headers are ever set (Cookie / Authorization).
          #    PricingService documents the never-send policy in comments and
          #    sets httpCookieAcceptPolicy=.never; grep for actual header use.
          cred_hits="$(grep -rnE 'forHTTPHeaderField.*(Cookie|Authorization)|addValue.*(Bearer|Cookie)' Sources/ || true)"
          if [ -n "$cred_hits" ]; then
            echo "Privacy gate failed: credential header use found:"
            echo "$cred_hits"
            exit 1
          fi
          # 3. Catalog URLs in code are allowlisted to openrouter.ai
          #    (docs + default endpoint). No other remote host may appear in
          #    the pricing sources or CLI.
          url_hits="$(grep -rhoE 'https?://[^"'"'"' )]+' Sources/TokenBarCore/PricingCatalog.swift Sources/TokenBarCore/PricingService.swift Sources/TokenBarApp/PricingController.swift Sources/TokenBarCLI/main.swift || true)"
          echo "$url_hits"
          # NOTE: plain for-loop (not a pipeline) so a failure exits the job.
          for url in $url_hits; do
            case "$url" in
              https://openrouter.ai/*) ;;
              *) echo "Privacy gate failed: non-allowlisted URL: $url"; exit 1 ;;
            esac
          done
          echo "Privacy gate passed: network confined to the documented pricing GET."
